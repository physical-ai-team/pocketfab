# PocketFab Nginx
#  :80   → :443 리다이렉트
#  :443  외부 진입점 (HTTPS + WebSocket) → C1 Gateway
#  :8080 내부 전용 (포트 공개 안 함) → C3 복제본 로드밸런싱

# Docker 내장 DNS. C3를 --scale로 늘리거나 줄여도 10초 안에 반영된다.
resolver 127.0.0.11 valid=10s ipv6=off;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream c1_gateway {
    server c1-gateway:8000;
}

upstream c3_backend {
    zone c3_backend 64k;
    least_conn;
    # max_fails=0: 바쁜 복제본의 503을 '고장'으로 보고 한동안 빼버리지 않게 한다
    server c3-inference:8000 resolve max_fails=0;
    keepalive 32;
}

server {
    listen 80;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    client_max_body_size 5m;

    location /ws/ {
        proxy_pass http://c1_gateway;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location / {
        proxy_pass http://c1_gateway;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

server {
    listen 8080;
    client_max_body_size 5m;

    location / {
        proxy_pass http://c3_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # 복제본이 바쁘면(503) 다른 복제본으로 넘긴다. POST라서 non_idempotent가 필요하다.
        proxy_next_upstream error timeout http_503 non_idempotent;
        proxy_read_timeout 30s;
    }
}
