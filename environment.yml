# PocketFab 로컬 개발용 conda 환경
#   생성:   conda env create -f environment.yml
#   갱신:   conda env update -f environment.yml --prune
#   활성화: conda activate pocketfab
#
# Docker 컨테이너는 이 파일이 아니라 각 서비스 폴더의 requirements.txt(pip)를 사용한다.
name: pocketfab
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pip:
      # 공통 서버
      - fastapi
      - uvicorn[standard]
      - python-multipart
      - httpx
      - pydantic>=2
      # 영상 처리
      - numpy
      - opencv-python-headless
      # C1
      - qrcode[pil]
      # 테스트 / 성능 측정 (tools/fake_camera.py)
      - websockets
      - pytest
      - pytest-asyncio
      # C3 (SAM 2) 의존성은 용량이 커서 C3 개발을 시작할 때 추가한다.
      #   CPU: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      #   SAM 2: c3-inference/README 참고 (추후 작성)
