<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PocketFab 카메라</title>
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; background: #111; color: #eee; }
    main { max-width: 640px; margin: 0 auto; padding: 16px; }
    h2 { margin: 0 0 12px; }
    video { width: 100%; max-height: 70vh; object-fit: contain; background: #000; border-radius: 8px; display: block; }
    .row { display: flex; gap: 8px; margin: 12px 0; align-items: center; flex-wrap: wrap; }
    button { font-size: 18px; padding: 12px 20px; border: 0; border-radius: 8px; background: #2d7ff9; color: #fff; }
    button.stop { background: #d33; }
    select { font-size: 16px; padding: 8px; max-width: 100%; }
    label { display: flex; gap: 6px; align-items: center; }
    #status { font-size: 14px; color: #aaa; white-space: pre-line; }
    #hint { font-size: 13px; color: #888; }
    .error { color: #ff6b6b !important; }
  </style>
</head>
<body>
<main>
  <h2>PocketFab 카메라</h2>
  <video id="video" autoplay playsinline muted></video>
  <div class="row">
    <button id="toggle">스트리밍 시작</button>
    <label>FPS
      <select id="fps"><option>5</option><option>10</option><option>15</option><option selected>30</option></select>
    </label>
  </div>
  <div class="row">
    <label>카메라 <select id="camera"><option value="">후면 카메라 (기본)</option></select></label>
    <label>해상도
      <select id="resolution">
        <option value="640">640 (권장)</option>
        <option value="960">960</option>
        <option value="1280">1280</option>
      </select>
    </label>
  </div>
  <div id="status">대기 중</div>
  <p id="hint">폰을 가로로 눕히면 컨베이어가 화면에 더 크게 찍힙니다. 시작한 뒤에도 방향을 바꿀 수 있습니다.</p>
</main>
<canvas id="canvas" hidden></canvas>

<script>
// 스펙: docs/api-spec.md 3.1 — JPEG 1장 = 바이너리 메시지 1개
const JPEG_QUALITY = 0.7;

const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const btn = document.getElementById("toggle");
const statusEl = document.getElementById("status");
const fpsSel = document.getElementById("fps");
const cameraSel = document.getElementById("camera");
const resSel = document.getElementById("resolution");

let ws = null, stream = null, timer = null, wakeLock = null;

function setStatus(text, isError = false) {
  statusEl.textContent = text;
  statusEl.classList.toggle("error", isError);
}

// 시작하는 동안·스트리밍 중에는 설정을 못 바꾸게 한다 (바꾸려면 중지 → 다시 시작)
function lockSettings(locked) {
  for (const el of [fpsSel, cameraSel, resSel]) el.disabled = locked;
}

// 카메라 목록은 권한을 받은 뒤에야 이름(label)이 보인다. 그래서 시작한 뒤 한 번 채운다.
async function fillCameraList() {
  const devices = await navigator.mediaDevices.enumerateDevices();
  const cams = devices.filter(d => d.kind === "videoinput");
  const current = stream?.getVideoTracks()[0]?.getSettings().deviceId;
  cameraSel.innerHTML = `<option value="">후면 카메라 (기본)</option>` + cams.map((d, i) =>
    `<option value="${d.deviceId}" ${d.deviceId === current ? "selected" : ""}>${d.label || "카메라 " + (i + 1)}</option>`).join("");
}

function cameraConstraints() {
  const width = Number(resSel.value);
  const video = { width: { ideal: width }, height: { ideal: Math.round(width * 3 / 4) } };
  if (cameraSel.value) video.deviceId = { exact: cameraSel.value };
  else video.facingMode = "environment";  // 후면 카메라
  return { video, audio: false };
}

// 시연 중 폰 화면이 꺼지면 카메라도 멈춘다. 지원하는 브라우저에서는 화면을 켜 둔다.
async function keepScreenOn() {
  try { wakeLock = await navigator.wakeLock?.request("screen"); } catch { /* 지원 안 하면 무시 */ }
}
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && timer) keepScreenOn();  // 탭을 다시 열면 다시 요청
});

async function start() {
  if (!navigator.mediaDevices?.getUserMedia) {
    setStatus("이 브라우저에서는 카메라를 쓸 수 없습니다.\nhttps:// 주소로 접속했는지 확인하세요.", true);
    return;
  }
  lockSettings(true);
  btn.disabled = true;
  try {
    stream = await navigator.mediaDevices.getUserMedia(cameraConstraints());
  } catch (e) {
    setStatus("카메라를 켜지 못했습니다: " + e.message, true);
    lockSettings(false);
    btn.disabled = false;
    return;
  }
  video.srcObject = stream;
  await video.play();
  fillCameraList();
  keepScreenOn();

  ws = new WebSocket(`wss://${location.host}/ws/camera`);
  ws.onopen = () => {
    const fps = Number(fpsSel.value);
    ws.send(JSON.stringify({ type: "hello", device: navigator.userAgent,
                             width: video.videoWidth, height: video.videoHeight, fps }));
    timer = setInterval(sendFrame, 1000 / fps);
    setStatus("연결됨");
  };
  ws.onmessage = (ev) => {
    const s = JSON.parse(ev.data);
    if (s.type === "stats") {
      setStatus(`세션 ${s.session_id} · 보내는 크기 ${canvas.width}×${canvas.height}\n` +
                `보냄 ${s.sent} · 수락 ${s.accepted} · 버림 ${s.dropped}\n처리 ${s.processed_fps} fps`);
    }
  };
  ws.onclose = () => { if (ws) stop("서버 연결이 끊겼습니다.", true); };
  ws.onerror = () => setStatus("WebSocket 오류 (인증서 경고를 넘겼는지 확인하세요)", true);

  btn.disabled = false;
  btn.textContent = "중지";
  btn.classList.add("stop");
}

function sendFrame() {
  // 네트워크가 밀리면 쌓아두지 않고 이번 프레임은 건너뛴다
  if (!ws || ws.readyState !== WebSocket.OPEN || ws.bufferedAmount > 0) return;
  if (!video.videoWidth) return;  // 아직 영상이 준비되지 않음

  // 폰을 돌리면 영상의 가로·세로가 바뀐다. 매번 종횡비를 유지한 채 가로를 해상도 값에 맞춘다.
  const width = Math.min(Number(resSel.value), video.videoWidth);
  const height = Math.round(width * video.videoHeight / video.videoWidth);
  if (canvas.width !== width || canvas.height !== height) {
    canvas.width = width;
    canvas.height = height;
  }
  ctx.drawImage(video, 0, 0, width, height);
  canvas.toBlob((blob) => { if (blob && ws?.readyState === WebSocket.OPEN) ws.send(blob); },
                "image/jpeg", JPEG_QUALITY);
}

function stop(message = "중지됨", isError = false) {
  clearInterval(timer); timer = null;
  const old = ws; ws = null;  // onclose가 stop을 다시 부르지 않도록 먼저 비운다
  old?.close();
  stream?.getTracks().forEach(t => t.stop()); stream = null;
  wakeLock?.release(); wakeLock = null;
  btn.textContent = "스트리밍 시작";
  btn.classList.remove("stop");
  lockSettings(false);
  setStatus(message, isError);
}

btn.onclick = () => (ws ? stop() : start());
</script>
</body>
</html>
